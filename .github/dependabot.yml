version: 2
updates:
  # What the Flatpak bundles (Sendspin, MA client, …): a pip-compile lock, so Dependabot
  # re-resolves the whole tree. The only pip entry: a root entry also picked up flatpak/
  # and opened duplicate PRs (pyproject.toml uses minimum versions only).
  - package-ecosystem: pip
    directory: /flatpak
    schedule:
      interval: daily
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
